services:
  app:
    build: .
    restart: always
    image: "devpay/user-service:v4"
    container_name: user-service-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/devpay_user_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - devpayuserservice-net
    depends_on:
      - db

  db:
    image: "mysql:8.0"
    restart: always
    container_name: user-service-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devpay_user_service_db
    ports:
      - "3307:3306"
    networks:
      - devpayuserservice-net

networks:
  devpayuserservice-net:

